<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>3D Gaussian Splats - Drop-in example</title>
  <script type="text/javascript" src="js/util.js"></script>
  <script type="importmap">
    {
        "imports": {
            "three": "./lib/three.module.js",
            "@mkkellogg/gaussian-splats-3d": "./lib/gaussian-splats-3d.module.js"
        }
    }
  </script>
  <style>

    body {
      background-color: #000000;
      height: 100vh;
      margin: 0px;
    }

  </style>

</head>

<body>
    <select title="file" id="files">
        <option value='https://huggingface.co/cakewalk/splat-data/resolve/main/train.splat'>Train</option>
        <option value="https://huggingface.co/cakewalk/splat-data/resolve/main/plush.splat">Plush</option>
        <option value="https://huggingface.co/cakewalk/splat-data/resolve/main/nike.splat">Nike</option>
    </select>

  <script type="module">
    import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';
    import * as THREE from 'three';

    function setupRenderer() {
      const renderWidth = 800;
      const renderHeight = 600;

      const rootElement = document.createElement('div');
      rootElement.style.width = renderWidth + 'px';
      rootElement.style.height = renderHeight + 'px';
      rootElement.style.position = 'relative';
      rootElement.style.left = '50%';
      rootElement.style.top = '50%';
      rootElement.style.transform = 'translate(-50%, -50%)';
      document.body.appendChild(rootElement);

      const renderer = new THREE.WebGLRenderer({
          antialias: false
      });
      renderer.setSize(renderWidth, renderHeight);
      rootElement.appendChild(renderer.domElement);

      return {
        'renderer': renderer,
        'renderWidth': renderWidth,
        'renderHeight': renderHeight
      }
    }

    function setupCamera(renderWidth, renderHeight) {
      const camera = new THREE.PerspectiveCamera(65, renderWidth / renderHeight, 0.1, 500);
      camera.position.copy(new THREE.Vector3().fromArray([-1, -4, 6]));
      camera.lookAt(new THREE.Vector3().fromArray([0, 4, -0]));
      camera.up = new THREE.Vector3().fromArray([0, -1, -0.6]).normalize();
      return camera;
    }

    function setupThreeScene() {
      const threeScene = new THREE.Scene();
      const boxColor = 0xBBBBBB;
      const boxGeometry = new THREE.BoxGeometry(2, 2, 2);
      const boxMesh = new THREE.Mesh(boxGeometry, new THREE.MeshBasicMaterial({'color': boxColor}));
      threeScene.add(boxMesh);
      boxMesh.position.set(3, 2, 2);
      return threeScene;
    }

    function setupControls(camera, renderer) {
      const controls = new GaussianSplats3D.OrbitControls(camera, renderer.domElement);
      controls.rotateSpeed = 0.5;
      controls.maxPolarAngle = Math.PI * .75;
      controls.minPolarAngle = 0.1;
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      return controls;
    }

    const {renderer, renderWidth, renderHeight} = setupRenderer();
    const camera = setupCamera(renderWidth, renderHeight);
    const threeScene = setupThreeScene();
    const controls = setupControls(camera, renderer);

    const hasSharedArrayBuffers = window.crossOriginIsolated;
    const viewer = new GaussianSplats3D.DropInViewer({
        enableSIMDInSort: false,
        integerBasedSort: false,
        gpuAcceleratedSort: false,
        sharedMemoryForWorkers: hasSharedArrayBuffers,
        dynamicScene: true,
        halfPrecisionCovariancesOnGPU: true,
        sphericalHarmonicsDegree: 1,
        freeIntermediateSplatData: true,
        inMemoryCompressionLevel: 1, // Can't be used when progressive loading is on
        splatRenderMode: 0, //0 = ThreeD, 1 = TwoD
    });
    
    threeScene.add(viewer);
    
    async function load(scene) {
        if (viewer.getSceneCount() > 0) {
            await viewer.removeSplatScene(0, true);
        }

        viewer.addSplatScene(scene, {
            progressiveLoad: false,
            splatAlphaRemovalThreshold: 0.9,
        }).then(() => {
            console.log('Loaded scene:', scene);
        });
    }

    load('https://huggingface.co/cakewalk/splat-data/resolve/main/train.splat');

    requestAnimationFrame(update);
    function update() {
        requestAnimationFrame(update);
        // perform standard three.js update and render
        controls.update();
        renderer.render(threeScene, camera);
    }

    document.getElementById('files').addEventListener('change', (evt) => {
        load(evt.target.value);
    });

  </script>
</body>

</html>
